<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【仮】東海エコライフ LPプレビュー</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#17212b; --muted:#5b6670; --sun:#f2a900; --paper:#f4f6f5; --line:#d9dfdd; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Zen Kaku Gothic New",sans-serif; color:var(--ink); background:var(--paper); }
    .banner { background:var(--ink); color:#fff; text-align:center; padding:10px; font-size:12px; letter-spacing:.06em; }
    .wrap { width:min(820px, calc(100% - 40px)); margin:48px auto 80px; }
    h1 { margin:0 0 8px; font-size:clamp(1.6rem,4vw,2.2rem); font-weight:900; letter-spacing:.04em; }
    .brand { margin:0 0 10px; font-weight:900; letter-spacing:.1em; }
    .lead { color:var(--muted); margin:0 0 28px; }
    a.item { display:block; padding:20px 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
    a.item:hover { color:#2e6b73; }
    a.item strong { display:block; font-size:1.15rem; margin-bottom:4px; }
    a.item span { color:var(--muted); font-size:.92rem; }
    .note { margin-top:28px; font-size:.85rem; color:var(--muted); }
    .note a { color:#2e6b73; font-weight:700; }
  </style>
</head>
<body>
  <div class="banner">仮ページ一覧／本番未公開・検索非表示</div>

    <a class="item" href="./b/"><strong>LP-B（入替）｜蓄電池・太陽光の入替診断</strong><span>設置から10年以上の方向け</span></a>
    <a class="item" href="./b-new/"><strong>LP-B（新規）｜太陽光・蓄電池の設置診断</strong><span>穴を開けない太陽光・人気順位TOP3</span></a>

  </div>
</body>
</html>
